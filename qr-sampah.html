<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code Absen Vendor Sampah</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#f0f4f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center}
  h1{font-size:18px;font-weight:800;color:#1a6b3c;margin-bottom:4px}
  .sub{font-size:13px;color:#666;margin-bottom:24px}
  #qr-wrap{display:flex;justify-content:center;margin-bottom:20px}
  #qr-wrap canvas,#qr-wrap img{border-radius:12px;border:8px solid #fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .url-box{background:#f5f5f5;border-radius:10px;padding:10px 14px;font-size:11px;color:#555;word-break:break-all;margin-bottom:20px;text-align:left}
  .btn{padding:13px 24px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin:0 4px}
  .btn-print{background:#1a6b3c;color:#fff}
  .btn-dl{background:#e6f4ed;color:#1a6b3c}
  .note{margin-top:16px;font-size:11px;color:#aaa;line-height:1.6}

  @media print{
    body{background:#fff;padding:0}
    .card{box-shadow:none;border-radius:0;max-width:100%}
    .btn-wrap{display:none}
    .url-box{border:1px solid #ddd}
    h1{font-size:22px}
    #qr-wrap canvas,#qr-wrap img{width:260px!important;height:260px!important}
  }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:40px;margin-bottom:8px">🗑️</div>
  <h1>Scan untuk Absen Kedatangan</h1>
  <div class="sub">Vendor Sampah – SGC Blok B</div>

  <div id="qr-wrap"></div>

  <div class="url-box" id="url-display">Memuat URL...</div>

  <div class="btn-wrap">
    <button class="btn btn-dl" id="btn-dl" onclick="downloadQR()">⬇️ Download PNG</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ Print</button>
  </div>

  <div class="note">
    Tempel QR ini di pos security.<br>
    Vendor scan → browser terbuka → klik "Konfirmasi Kedatangan".<br>
    Tidak perlu login atau install aplikasi apapun.
  </div>
</div>

<!-- QR Code library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // URL halaman absen — sesuaikan jika path berbeda
  const BASE = 'https://nuryadipratama-cmyk.github.io/SGC-Blok-B';
  const ABSEN_URL = BASE + '/absen-sampah.html';

  document.getElementById('url-display').textContent = ABSEN_URL;

  const qr = new QRCode(document.getElementById('qr-wrap'), {
    text: ABSEN_URL,
    width: 220,
    height: 220,
    colorDark: '#1a6b3c',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });

  function downloadQR(){
    setTimeout(()=>{
      const canvas = document.querySelector('#qr-wrap canvas');
      if(!canvas){alert('QR belum siap, coba lagi.');return;}
      const a = document.createElement('a');
      a.download = 'qr-absen-vendor-sampah.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }, 300);
  }
</script>
</body>
</html>
